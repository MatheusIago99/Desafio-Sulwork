services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sulwork
      POSTGRES_USER: sulwork
      POSTGRES_PASSWORD: sulwork
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulwork -d sulwork"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
