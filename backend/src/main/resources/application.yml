spring:
  application:
    name: sulwork-eventos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sulwork}
    username: ${DB_USERNAME:sulwork}
    password: ${DB_PASSWORD:sulwork}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

sulwork:
  timezone: America/Sao_Paulo
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
